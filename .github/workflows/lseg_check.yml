name: LSEG secrets check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/lseg_check.yml", "tools/lseg_check.py"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q lseg-data
      - name: Check secrets and login (prints no data)
        env:
          LSEG_APP_KEY: ${{ secrets.LSEG_APP_KEY }}
          LSEG_USERNAME: ${{ secrets.LSEG_USERNAME }}
          LSEG_PASSWORD: ${{ secrets.LSEG_PASSWORD }}
        run: python tools/lseg_check.py
